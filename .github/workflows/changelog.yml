name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ignazio-ingenito/developer-workspace/.github/workflows/changelog-reusable.yml@0d253bfddd47cddb3c47ccba0e7dc82c123e4431
    with:
      app-client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
